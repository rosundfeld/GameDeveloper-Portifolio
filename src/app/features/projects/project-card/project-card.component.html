@let p = project();
<article class="project" [class.no-image]="!p.image">
  @if (p.image; as image) {
    <div class="frame">
      <img [src]="image.src" [alt]="image.alt" loading="lazy" />
    </div>
  }
  <div>
    <h3>{{ p.title }}</h3>
    <p>{{ p.description }}</p>
    <dl class="facts">
      @for (fact of facts(); track fact.label) {
        <div>
          <dt>{{ fact.label }}</dt>
          <dd>{{ fact.value }}</dd>
        </div>
      }
    </dl>
    @if (p.playUrl) {
      <a class="btn" [href]="p.playUrl" [attr.aria-label]="'Jogar no itch.io: ' + p.title">Jogar no itch.io</a>
    }
    @if (p.gddUrl) {
      <a class="btn ghost" [href]="p.gddUrl" [attr.aria-label]="'Ver o GDD: ' + p.title">Ver o GDD</a>
    }
    @if (p.repoUrl) {
      <a class="btn ghost" [href]="p.repoUrl" [attr.aria-label]="'Ver no GitHub: ' + p.title">Ver no GitHub</a>
    }
  </div>
</article>
